# Shared defaults. Every experiment config starts with `_base_: base.yaml` and
# overrides only what it changes, so the ablations differ by exactly the lines
# that are supposed to differ.
#
# Override any leaf from the command line:
#   python train.py --config configs/enhance.yaml --set train.lr=3e-4 model.base=48

project:
  name: scandar
  seed: 1234
  deterministic: false      # true costs throughput; use when a number must be bit-reproducible

# --- data ----------------------------------------------------------------
data:
  # Split by *source scan*: two degraded versions of the same page must never end
  # up on opposite sides of a split. 50 scans -> 40 / 5 / 5.
  split_seed: 1234
  n_val_scans: 5
  n_test_scans: 5

  # Cached scans, downscaled once so the generator is not re-reading 2480x3512
  # JPEGs inside every __getitem__.
  scan_long_side: 1600

  # The synthetic "photo" canvas the scan gets composited onto. Chosen close to
  # the real photos (1920x2560) but cheap enough to warp on the fly.
  canvas: [1152, 1536]      # width, height

  # The rectified page the enhancement network works on. A4 aspect (1:1.414).
  # Kept high because legibility is the point: at 256x256 a whole page reduces a
  # pen stroke to under a pixel, and no loss function can bring it back.
  rect_size: [1024, 1448]   # width, height

  # Training crops. The enhancement net is fully convolutional, so it trains on
  # patches and infers on whole pages.
  patch_size: 256

  # How many patches are cut from one composited photo. Compositing costs ~140 ms
  # and a patch costs ~2, so this is worth four times the throughput; the loader
  # must not shuffle for it to work. Raising it further trades sample diversity
  # within a batch for speed — at 16, a batch of 16 would be one photo.
  patches_per_photo: 4

  # The brief's §3.2 option: many degradations of few scans, or few degradations
  # of many? Set this to a number to shrink the pool of training scans while the
  # step count stays fixed, which is that experiment and nothing else.
  train_scan_limit: null

  # The corner detector sees the whole photo, downsized — corner localisation
  # does not need resolution the way text restoration does.
  corner_input: 256

  # Heatmap targets for the second corner-detection approach. Sigma is in
  # heatmap pixels, so it scales with this size, not with the input size.
  heatmap_size: 128
  heatmap_sigma: 3.0

  # Patch sampling. A uniformly random crop of an A4 page is very often blank
  # margin; up to `patch_tries` boxes are drawn and the first with at least this
  # much contrast wins, which favours text without ever excluding blank paper.
  patch_tries: 4
  min_patch_std: 0.045

  # Frozen evaluation sets, generated once with a fixed seed and written to disk,
  # one set per task: the corner detector's samples include tinted stock, a
  # distractor sheet and curled pages, none of which the enhancement network can
  # be scored on — its target is the flat clean scan.
  #
  # The training bucket is frozen too. The generator never repeats a sample, so
  # "the training set" is a distribution rather than a set of files, and a fixed
  # draw from it is the only honest way to fill in the brief's Training row.
  frozen_tasks: [enhance, corner]
  frozen_train_samples: 200
  frozen_val_samples: 200
  frozen_test_samples: 200

  # Deterministic patches cut from each frozen page for the per-epoch validation
  # curve. Patch-level, so the validation loss is measured on exactly the same
  # kind of crop as the training loss and the two curves can be read against each
  # other; the full-page table is `evaluate.py`'s job.
  frozen_patches_per_page: 2

# --- placing the page on the background (brief §1.3) ----------------------
synth:
  landscape_prob: 0.10          # the phone held sideways, as in one real photo
  page_scale: [0.42, 0.90]      # page height as a fraction of the canvas height
  rotation_deg: 30.0            # beyond ~45 deg "top-left" stops being defined
  keystone: [0.78, 1.00]        # one edge squeezed: photographed from an angle
  corner_jitter: 0.06           # per-corner nudge, as a fraction of the page
  center_jitter: 0.06
  max_tries: 40                 # rejection sampling budget per sample

  feather_sigma: [0.6, 1.6]     # no real camera records a hard one-pixel seam
  drop_shadow_prob: 0.85
  drop_shadow_offset: [4.0, 26.0]
  drop_shadow_sigma: [6.0, 30.0]
  drop_shadow_strength: [0.10, 0.45]

  procedural_prob: 0.25         # generated textures alongside the real surfaces

  # Corner-detector only: these break the enhancement network's assumption that
  # the clean scan is what the page should look like, so its options turn them
  # off. They exist because the real photos include a dark printed card, a
  # coloured cover, a page resting on other paper and one that will not lie flat.
  page_tint_prob: 0.25
  page_dark_prob: 0.10
  distractor_prob: 0.20
  curl_prob: 0.20

# --- degradation pipeline (brief §4) --------------------------------------
# These ranges are the `medium` reference; `severity` stretches all of them at
# once, which is what keeps the severity study a one-line change.
degradation:
  severity: medium              # mild | medium | hard
  downscale: [2.0, 4.0]
  brightness: [-0.12, 0.12]
  contrast: [0.82, 1.20]
  color_gain: [0.88, 1.12]
  illumination_amplitude: [0.06, 0.30]
  vignette_prob: 0.5
  vignette_strength: [0.05, 0.35]
  shadow_count: [0, 3]
  shadow_strength: [0.15, 0.60]
  shadow_blur: [10.0, 60.0]
  hard_shadow_prob: 0.20
  arm_shadow_prob: 0.35         # the photographer's own arm over the page
  specular_prob: 0.25
  specular_strength: [0.10, 0.45]
  blur_sigma: [0.4, 2.0]
  motion_blur_prob: 0.35
  motion_length: [3, 15]
  noise_sigma: [0.004, 0.03]
  jpeg_quality: [30, 80]

# --- the model and the loss -----------------------------------------------
# Deliberately *not* here. This file holds what the whole project shares — the
# data, the generator, the schedule — and the two tasks share none of their
# architecture: an image-to-image U-Net and a corner detector have no settings in
# common, and a `model:` block inherited from here would hand one of them the
# other's keys. So `enhance.yaml`, `corner_reg.yaml` and `corner_heat.yaml` each
# carry their own, and the ablations inherit from whichever of those they vary.
#
# What *is* shared is a rule: the first version of every model in this project
# carries no dropout and no weight decay, because the brief requires it (§3.1,
# §5) and because the regularisation study later depends on dropout being the
# only thing that changed.

# --- training -------------------------------------------------------------
train:
  device: auto              # auto | cuda | cpu
  amp: true                 # mixed precision, ignored on CPU
  num_workers: auto
  batch_size: 16
  grad_accum: 1             # keep batch_size * grad_accum constant across machines
  epochs: 60
  iters_per_epoch: 400      # the generator is infinite, so an "epoch" is a choice
  optimizer: adam
  lr: 2.0e-4
  weight_decay: 0.0         # no explicit regularisation before the dropout study
  scheduler: cosine
  warmup_epochs: 2
  min_lr: 1.0e-6
  grad_clip: 1.0
  max_hours: null           # wall-clock guard so a Colab session stops cleanly
  resume: auto              # auto | none | <path to checkpoint>

# --- logging --------------------------------------------------------------
log:
  every_n_steps: 50
  save_every_epoch: true
  keep_best_on: val_loss    # overridden per task, e.g. val_psnr / val_corner_err
  best_mode: auto           # auto | max | min — auto reads the metric's name
