# Loss ablation: give the gradient term real weight  (brief §3.2)
#
# The baseline run's own log is the argument for this one. Over 60 epochs the L1
# term fell 26-fold and the MS-SSIM term 4-fold, while the Sobel term went from
# 0.0992 to 0.0768 — a factor of 1.3, essentially flat from the first epoch. At a
# weight of 0.25 the optimiser found it far cheaper to fix intensities and coarse
# structure than to fix stroke edges, so it did that and left the edges alone.
#
# Which is a problem, because the edges are the whole point. The brief puts it
# directly: text legibility lives in the edges. A restoration can be correct in
# mean intensity, plausible in structure, and still leave handwriting that reads
# as soft — which is exactly what the baseline produces.
#
# So the gradient term is raised to match L1's weight. Nothing else changes: same
# architecture, same schedule, same data, so the comparison is about this one
# number.
#
# Watch for the failure mode on the other side. A gradient term that dominates
# buys sharpness by adding overshoot at edges — bright halos on the light side of
# a stroke and a dark fringe on the other, the same artefact an over-aggressive
# unsharp mask produces. If the zoomed crops show that, step back to 0.5:
#
#   python train.py --config configs/enhance_sharp.yaml --set loss.sobel=0.5
#
# PSNR will probably not reward this and may fall slightly — it is a mean-squared
# measure and does not care much about edge crispness. Judge it on SSIM, on the
# zoomed text crops, and once the OCR study exists, on readability. That gap
# between what PSNR rewards and what a reader wants is worth a paragraph in the
# report on its own.

_base_: enhance.yaml

run:
  name: enhance_sharp

loss:
  l1: 1.0
  mse: 0.0
  msssim: 0.5
  sobel: 1.0
