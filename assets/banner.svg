<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="ScanDar — a phone photo of a page in, a clean scan out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#0b1220" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0b1220" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#93a4c4" fill-opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="330" rx="18" fill="url(#glow)"/>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="132" font-size="72" font-weight="700" letter-spacing="-1.5" fill="url(#word)">ScanDar</text>
    <text x="76" y="176" font-size="21" fill="#9fb0c9">A phone photo of a page goes in. A clean scan comes out.</text>
    <text x="76" y="208" font-size="16" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">two CNNs · built from scratch · no pre-trained weights</text>

    <!-- step chips -->
    <g>
      <rect x="74" y="238" width="108" height="34" rx="17" fill="#132038" stroke="#22c55e" stroke-opacity="0.35"/>
      <text x="128" y="260" font-size="15" fill="#86efac" text-anchor="middle">detect</text>

      <rect x="192" y="238" width="108" height="34" rx="17" fill="#132038" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="246" y="260" font-size="15" fill="#7dd3fc" text-anchor="middle">flatten</text>

      <rect x="310" y="238" width="108" height="34" rx="17" fill="#132038" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="364" y="260" font-size="15" fill="#c4b5fd" text-anchor="middle">restore</text>

      <rect x="428" y="238" width="250" height="34" rx="17" fill="#111c31" stroke="#334155"/>
      <text x="553" y="260" font-size="14" fill="#94a3b8" text-anchor="middle">+11.4 dB PSNR · 1.06 px corners</text>
    </g>
  </g>

  <!-- the pipeline, drawn -->
  <g transform="translate(712, 40)">
    <!-- the photograph: a page on a desk, seen at an angle -->
    <rect x="0" y="8" width="196" height="234" rx="12" fill="#182238" stroke="#26334f"/>
    <g>
      <polygon points="44,44 158,30 172,196 32,208" fill="#eef2f8"/>
      <g fill="#8fa0b8" fill-opacity="0.85">
        <rect x="56" y="60" width="88" height="5" rx="2.5" transform="rotate(-4 56 60)"/>
        <rect x="56" y="78" width="100" height="5" rx="2.5" transform="rotate(-4 56 78)"/>
        <rect x="56" y="96" width="72" height="5" rx="2.5" transform="rotate(-4 56 96)"/>
        <rect x="52" y="122" width="104" height="5" rx="2.5" transform="rotate(-2 52 122)"/>
        <rect x="52" y="140" width="86" height="5" rx="2.5" transform="rotate(-2 52 140)"/>
        <rect x="50" y="166" width="98" height="5" rx="2.5"/>
      </g>
      <polygon points="44,44 158,30 172,196 32,208" fill="url(#shade)"/>
      <polygon points="44,44 158,30 172,196 32,208" fill="none" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.9"/>
      <g fill="#34d399">
        <circle cx="44" cy="44" r="6"/><circle cx="158" cy="30" r="6"/>
        <circle cx="172" cy="196" r="6"/><circle cx="32" cy="208" r="6"/>
      </g>
    </g>

    <path d="M 214 126 L 258 126" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)" stroke-opacity="0.9"/>

    <!-- the scan -->
    <rect x="284" y="14" width="168" height="222" rx="8" fill="#ffffff"/>
    <g fill="#334155">
      <rect x="304" y="42" width="112" height="5" rx="2.5"/>
      <rect x="304" y="62" width="128" height="5" rx="2.5"/>
      <rect x="304" y="82" width="96" height="5" rx="2.5"/>
      <rect x="304" y="112" width="128" height="5" rx="2.5"/>
      <rect x="304" y="132" width="108" height="5" rx="2.5"/>
      <rect x="304" y="152" width="124" height="5" rx="2.5"/>
      <rect x="304" y="182" width="80" height="5" rx="2.5"/>
      <rect x="304" y="202" width="116" height="5" rx="2.5"/>
    </g>
  </g>
</svg>
