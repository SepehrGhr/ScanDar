# ScanDar — exact local environment (reproduces the machine the results were produced on)
#
#   conda env create -f environment.yml
#   conda activate scandar
#   pip install -e .
#
# On Google Colab, do NOT use this file: the runtime already has torch + CUDA.
# Run notebooks/00_colab_bootstrap.ipynb instead, which installs requirements.txt.

name: scandar

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - tesseract

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1
      - torchvision==0.20.1

      - numpy==2.0.1
      - opencv-python-headless>=4.9
      - pillow>=10
      - pyyaml>=6
      - matplotlib>=3.8
      - pandas>=2.0
      - tqdm>=4.66
      - pytest>=8
      - ipykernel>=6
      - pytesseract>=0.3.10
      - gradio>=4
